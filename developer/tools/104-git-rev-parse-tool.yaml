name: git_rev_parse
description: "Pick out and massage parameters (e.g., resolve revisions)"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - arg
    - short
    - verify
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'rev-parse')
      default: "rev-parse"
    arg:
      type: string
      description: Revision or other argument (e.g., HEAD, --git-dir)
      default: "HEAD"
    short:
      type: boolean
      description: Show the shortest unique prefix
      default: false
    verify:
      type: boolean
      description: Verify that the argument is a valid reference
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    short: "--short"
    verify: "--verify"
  positional:
    - subcommand
    - arg
