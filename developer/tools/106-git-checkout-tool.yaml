name: git_checkout
description: "Switch branches or restore working tree files"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - target
    - new_branch
    - detach
    - force
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'checkout')
      default: "checkout"
    target:
      type: string
      description: Branch, tag, commit, or path to checkout
    new_branch:
      type: boolean
      description: Create and switch to a new branch
      default: false
    detach:
      type: boolean
      description: Detach HEAD at named commit
      default: false
    force:
      type: boolean
      description: Force checkout (discard local changes)
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    new_branch: "-b"
    detach: "--detach"
    force: "-f"
  positional:
    - subcommand
    - target
