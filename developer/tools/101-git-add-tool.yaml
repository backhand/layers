name: git_add
description: "Add file contents to the index"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - path
    - all
    - update
    - patch
    - force
    - verbose
    - dry_run
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'add')
      default: "add"
    path:
      type: string
      description: Pathspec to add (e.g., . or a file path)
      default: "."
    all:
      type: boolean
      description: Add changes from all tracked and untracked files
      default: false
    update:
      type: boolean
      description: Update tracked files (no untracked)
      default: false
    patch:
      type: boolean
      description: Interactively choose hunks of patch between the index and the work tree
      default: false
    force:
      type: boolean
      description: Allow adding otherwise ignored files
      default: false
    verbose:
      type: boolean
      description: Be verbose
      default: false
    dry_run:
      type: boolean
      description: Dry run
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    all: "-A"
    update: "-u"
    patch: "-p"
    force: "-f"
    verbose: "-v"
    dry_run: "-n"
  positional:
    - subcommand
    - path
