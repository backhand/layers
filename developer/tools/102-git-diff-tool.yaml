name: git_diff
description: "Show changes between commits, commit and working tree, etc."
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - path
    - staged
    - name_only
    - color_words
    - word_diff
    - patch
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'diff')
      default: "diff"
    path:
      type: string
      description: Optional pathspec to limit the diff to
      default: "."
    staged:
      type: boolean
      description: Show diff of staged changes
      default: false
    name_only:
      type: boolean
      description: Show only names of changed files
      default: false
    color_words:
      type: boolean
      description: Show word diff with color highlights
      default: false
    word_diff:
      type: boolean
      description: Show word diff
      default: false
    patch:
      type: boolean
      description: Generate patch
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    staged: "--staged"
    name_only: "--name-only"
    color_words: "--color-words"
    word_diff: "--word-diff"
    patch: "-p"
  positional:
    - subcommand
    - path
