name: web_fetch
description: >-
  Fetches information from a webpage by URL. Optionally return screenshots.
enabled: true
type: function
parameters:
  type: object
  additionalProperties: false
  required:
    - url
    - screenshots
    # - task
  properties:
    url:
      type: string
      description: Full webpage URL
    # task:
    #   type: string
    #   description: An optional prompt for describing the screenshots
    screenshots:
      type: boolean
      description: Whether to include screenshots in result.