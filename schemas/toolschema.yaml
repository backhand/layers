$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  id:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
  name:
    type: string
  description:
    type: string
  enabled:
    default: true
    type: boolean
  type:
    type: string
    enum:
      - function
      - http
      - shell
  parameters:
    type: object
    propertyNames: {}
    additionalProperties: {}
  config:
    type: object
    propertyNames:
      type: string
    additionalProperties: {}
  tags:
    type: array
    items:
      type: string
required:
  - name
  - enabled
additionalProperties: false
