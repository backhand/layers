$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  id:
    type: string
  name:
    type: string
  prompt:
    description: The prompt for the task
    type: string
  cron:
    description: The cron expression for the task
    type: string
  purpose:
    type: string
  flow:
    description: The flow to use for the task
    type: string
  subtasks:
    type: array
    items:
      type: string
  workdir:
    description: The directory to work in
    type: string
  evaluation:
    description: The evaluation for the task
    type: string
  status:
    default: pending
    type: string
    enum:
      - pending
      - in_progress
      - completed
      - blocked
  created_at:
    type: string
    format: date-time
    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
  updated_at:
    type: string
    format: date-time
    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
  due_date:
    type: string
    format: date-time
    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
  priority:
    type: string
    enum:
      - low
      - medium
      - high
  assigned_to:
    type: string
  notes:
    type: string
  dependencies:
    type: array
    items:
      type: string
required:
  - purpose
additionalProperties: false
