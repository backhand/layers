$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  version:
    default: "1.0"
    type: string
  id:
    type: string
    format: uuid
    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12})$
  name:
    type: string
  description:
    type: string
  order:
    type: number
  enabled:
    default: true
    type: boolean
  aspects:
    description: Aspects this instruction belongs to. If not specified, the
      instruction is generic and if an empty list it is for none
    type: array
    items:
      type: string
  tags:
    description: Tags for this instruction
    type: array
    items:
      type: string
  content:
    type: string
required:
  - version
  - name
  - description
  - enabled
  - content
additionalProperties: false
