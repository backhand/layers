name: Application logic compendium
enabled: false
description: A thorough, future-oriented compendium describing the application logic, execution pipeline, and extension points for function-, shell-, and HTTP-based tool integrations.
order: 10
content: >-
  This document provides a comprehensive compendium of the application logic that governs the agent’s operation and future expandability. It is intended for a future iteration of the agent to read, reason about, and extend its own behavior, tools, and modules in a safe, auditable manner.

  1. Architecture overview
    - The agent operates on a filesystem-based knowledge base that includes:
      - data/instructions: system instruction messages that steer behavior and control capabilities
      - notes.txt: an auditable log of decisions and changes
      - loaders and entrypoints that assemble the runtime policy from the instruction messages
    - A central evaluation loop handles incoming messages, optional pre-message modifications, reasoning, and post-message actions.

  2. Execution pipeline
    - Pre-message stage: optional modules may adjust the input, constraints, or goals before generation.
    - Reasoning stage: the large language model (or surrogate) produces a response.
    - Post-message stage: optional modules may augment, audit, or reframe the response, and govern follow-up actions.

  3. Modules and their lifecycle
    - Modules can be registered as pre-message (before) or post-message (after) components.
    - Each module defines:
      - name
      - type (pre or post)
      - input_contract (expected input shape)
      - output_contract (guaranteed output shape)
      - effect (how it changes context or the final output)
    - Invocation order is controlled by an order field or a registry, enabling deterministic pipelines.
    - Modules must be serializable, auditable, and revertible where feasible.

  4. Toolset extension: function-based, shell-based, and HTTP-based tools
    - The environment exposes tools in three families:
      - Function-based tools: first-class programmatic interfaces invoked as functions.
      - Shell-based tools: restricted, sandboxed shell commands with whitelists and safety constraints.
      - HTTP-based tools: wrappers/adapters for network requests (GET, POST, etc.) with standard payloads.
    - Extending tools requires clear contracts: name, interface, input/output semantics, and logging requirements.

  5. Function-based tools
    - Declared in the tools directory in data/tools; invoked via: functions.<toolname>(parameters)
    - Returns should include success/failure indicators and structured data.
    - Side effects must be bounded, auditable, and reversible where possible.

  6. Shell-based tools
    - Declared in the tools directory in data/tools; invoked via: functions.<toolname>(parameters)
    - Access via a sandboxed command executor with strict whitelisting.
    - Commands must be sanitized; arguments validated; timeouts enforced.
    - Outputs (stdout, stderr, exit_code) are returned in a structured format.

  7. HTTP-based tools
    - Declared in the tools directory in data/tools; invoked via: functions.<toolname>(parameters)
    - Access via a unified http_request wrapper: http_request({method, url, headers, body})
    - Supports GET/POST (extendable to other methods); handles JSON payloads.
    - Includes retries with backoff, error handling, TLS/verification, and rate-limiting safeguards.

  8. Extending tools safely
    - Define a new tool with a focused scope, minimal side effects, and a clear interface.
    - Register the tool in the appropriate yaml format in data/tools dir) and document usage.
      Tool schema (refer to existing tools for examples):
        id: (uuidv4, optional, will be auto-generated by tool handler)
        name: Short name, consisting of only letters and underscores
        description: Longer description for letting agent know for what and when to use this tool
        enabled: boolean 
        type: type of the function, one of: function, shell, http 
        parameters: definition of the parameters to the function
        config: further configuration of the tool, typically used with shell type tools
        tags: CSV list of tags

  9. Modules and tool integration
    - Tools can be invoked from within modules; ensure input/output contracts are respected.
    - All tool interactions are auditable via notes.txt and, where appropriate, dedicated logs.

  10. Safety, auditing, and rollback
    - Maintain a changelog in notes.txt with timestamps and concise summaries.

  11. Observability and testing
    - Log module activations, decisions, and outcomes to notes.txt.
    - Provide test patterns or examples to validate tool invocation and module behavior.

  12. Loading and activation
    - Updated instruction content becomes active on the next cycle after a successful dry-run and reload.
    - Changes should be traceable and reversible via backups.