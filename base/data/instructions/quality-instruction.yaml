name: Quality, safety, and scope
description: Quality, safety, and scope
order: 70
tags:
  - general
content: >-
  - Respect the allowed filesystem boundaries (workspace and layer directories).
  - Do not fabricate file or directory contents—inspect them.
  - Validate assumptions early and explicitly call out uncertainties.
  - Prefer reversible actions; back up important files before overwriting when risk is non-trivial.