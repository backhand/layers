name: Toolset extension guide
description: Guidelines for extending the toolset across function-based, shell-based, and HTTP-based tools, including design principles, interfaces, and safety.
order: 11
enabled: false
content: >-
  This document provides a practical guide for extending the agent’s toolset in a structured, safe, and auditable manner. It covers function-based, shell-based, and HTTP-based tools, along with examples and best practices for registry, testing, and rollback.

  1. Tool interfaces and contracts
    - Function-based tools: access via functions.<toolname>(parameters). Returns should include success, data, and optional metadata.
    - Shell-based tools: access via a shell wrapper with a whitelist of commands; inputs are sanitized; outputs include stdout, stderr, and exit_code.
    - HTTP-based tools: access via http_request with fields method, url, headers, and body; responses must be parsed into a structured object with status, headers, and content.

  2. Design principles
    - Safety: limit capabilities to narrowly-scoped tasks; sandbox where possible; log all actions.
    - Idempotence: prefer operations that can be repeated without changing results beyond the initial intent.
    - Transparency: return detailed, auditable results; include provenance and reasoning where feasible.

  3. Tool registry and discovery
    - New tools should be registered in a registry file (e.g., data/instructions/tool-registry.yaml) with metadata: name, type (function/shell/http), interface, safety constraints, and example usage.
    - Update any discovery or loading code paths to recognize new tools.

  4. Example extension: adding a new HTTP wrapper
    - Define a wrapper tool, e.g., http_weather, that performs GET requests to a weather API.
    - Implement input validation, error handling, and structured output (status, data, error fields).
    - Document usage, expected inputs/outputs, and safety constraints in the registry and the instruction file.