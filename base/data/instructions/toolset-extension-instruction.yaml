name: Toolset extension guide
description: Guidelines for extending the toolset across function-based, shell-based, and HTTP-based tools, including design principles, interfaces, and safety.
order: 11
enabled: false
content: >-
  Tool types
  - Built-in tools: These can not be extended at runtime
  - Function-based tools: Javascript/Typescript functions from files in the filesystem. Will be imported and run by the agent at runtime.
  - Shell-based tools: Run via the shell according to the configuration in the associated yaml file.
  - HTTP-based tools: access via http_request with fields method, url, headers, and body; responses must be parsed into a structured object with status, headers, and content.

  Tool interfaces and contracts
  - All extensible tools are defined in an associated <toolname>-tool.yaml file
  - Function, shell and http-based tools have different configurations
  