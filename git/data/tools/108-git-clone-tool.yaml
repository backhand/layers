name: git_clone
description: "Clone a repository into a new directory"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - repo
    - outputDir
    - recurse_submodules
    - progress
    - quiet
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'clone')
      default: "clone"
    repo:
      type: string
      description: Repository URL to clone
    recurse_submodules:
      type: boolean
      description: Initialize submodules in the clone
      default: false
    progress:
      type: boolean
      description: Force progress reporting
      default: false
    quiet:
      type: boolean
      description: Suppress summary message
      default: false
    outputDir:
      type: string
      description: >-
        Which path to check out the directory in - use full path + repo name
        Example:
          If checking out a repo named my-great-repo and you want the cloned repo to 
          be adirectory in in /Users/foobar/repositories use the path:
            /Users/foobar/repositories/my-great-repo

  additionalProperties: false
config:
  command: /opt/homebrew/bin/git
  flags:
    recurse_submodules: "--recurse-submodules"
    progress: "--progress"
    quiet: "-q"
  positional:
    - subcommand
    - progress
    - recurse_submodules
    - quiet
    - repo
    - outputDir
