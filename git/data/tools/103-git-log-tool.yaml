name: git_log
description: "Show commit logs"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - path
    - oneline
    - graph
    - decorate
    - patch
    - stat
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'log')
      default: "log"
    path:
      type: string
      description: Optional pathspec to limit the log to a file or directory
      default: "."
    oneline:
      type: boolean
      description: Condense each commit to a single line
      default: false
    graph:
      type: boolean
      description: Draw a text-based graphical representation of the commit history
      default: false
    decorate:
      type: boolean
      description: Print out ref names of any commits that are shown
      default: false
    patch:
      type: boolean
      description: Show the patch introduced with each commit
      default: false
    stat:
      type: boolean
      description: Show diffstat instead of the full diff
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    oneline: "--oneline"
    graph: "--graph"
    decorate: "--decorate"
    patch: "-p"
    stat: "--stat"
  positional:
    - subcommand
    - path
