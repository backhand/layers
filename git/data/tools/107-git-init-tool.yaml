name: git_init
description: "Create an empty Git repository or reinitialize an existing one"
enabled: true
type: shell
parameters:
  type: object
  required:
    - subcommand
    - path
    - bare
    - quiet
  properties:
    subcommand:
      type: string
      description: The git subcommand (fixed to 'init')
      default: "init"
    path:
      type: string
      description: Directory to initialize (default current directory)
      default: "."
    bare:
      type: boolean
      description: Create a bare repository
      default: false
    quiet:
      type: boolean
      description: Be quiet
      default: false
  additionalProperties: false
config:
  command: git
  flags:
    bare: "--bare"
    quiet: "-q"
  positional:
    - subcommand
    - path
