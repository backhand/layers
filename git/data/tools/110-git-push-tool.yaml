
name: git_push
description: Push commits to a remote; supports -u, --force-with-lease, --all, and --tags.
enabled: true
type: shell
parameters:
  type: object
  properties:
    subcommand:
      type: string
      description: Static git subcommand
      default: push
    quiet:
      type: boolean
      description: Suppress all output (-q)
      default: false
    dry_run:
      type: boolean
      description: Do everything except actually send the updates (--dry-run)
      default: false
    set_upstream:
      type: boolean
      description: Set upstream for the branch (-u)
      default: false
    force_with_lease:
      type: boolean
      description: Force push but safely (checks remote updates) (--force-with-lease)
      default: false
    push_all:
      type: boolean
      description: Push all branches (--all)
      default: false
    tags:
      type: boolean
      description: Push all tags (--tags)
      default: false
    remote:
      type: string
      description: Remote name to push to
      default: origin
    branch:
      type: string
      description: Branch or refspec to push (leave empty to let Git infer)
      default: ""
  required:
    - subcommand
    - quiet
    - dry_run
    - set_upstream
    - force_with_lease
    - push_all
    - tags
    - remote
    - branch
  additionalProperties: false

config:
  command: /opt/homebrew/bin/git
  flags:
    quiet: -q
    dry_run: --dry-run
    set_upstream: -u
    force_with_lease: --force-with-lease
    push_all: --all
    tags: --tags
  positional:
    - subcommand
    - quiet
    - dry_run
    - set_upstream
    - force_with_lease
    - push_all
    - tags
    - remote
    - branch
