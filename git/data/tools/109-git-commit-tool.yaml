
name: git_commit
description: Create a commit with a message; supports -a, --amend, and other common flags.
enabled: true
type: shell
parameters:
  type: object
  properties:
    subcommand:
      type: string
      description: Static git subcommand
      default: commit
    message_flag:
      type: string
      description: The flag used to pass the commit message
      default: -m
    message:
      type: string
      description: Commit message to use with -m
    all:
      type: boolean
      description: Stage and include all modified tracked files (-a)
      default: false
    amend:
      type: boolean
      description: Amend the previous commit (--amend)
      default: false
    no_edit:
      type: boolean
      description: Use existing commit message when amending (--no-edit)
      default: false
    allow_empty:
      type: boolean
      description: Allow an empty commit (--allow-empty)
      default: false
    quiet:
      type: boolean
      description: Suppress summary message (-q)
      default: false
    verbose:
      type: boolean
      description: Show unified diff in commit message editor (-v)
      default: false
    path:
      type: string
      description: Optional pathspec to limit what is committed (defaults to .)
      default: .
  required:
    - subcommand
    - message_flag
    - message
    - all
    - amend
    - no_edit
    - allow_empty
    - quiet
    - verbose
    - path
  additionalProperties: false

config:
  command: /opt/homebrew/bin/git
  flags:
    all: -a
    amend: --amend
    no_edit: --no-edit
    allow_empty: --allow-empty
    quiet: -q
    verbose: -v
  positional:
    - subcommand
    - quiet
    - verbose
    - all
    - amend
    - no_edit
    - allow_empty
    - message_flag
    - message
    - path
